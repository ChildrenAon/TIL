<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>규정 문서 반영 복습</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* ONE Student 규정 문서 반영 복습. 저절로 장면마다 재생 · 반복, 플레이어 조작(이전 · 멈춤 · 다음 · 속도)만 둔다. 장면은 상자 몇 개로 간결하게. */
:root {
  --bg: #f3f5f9; --panel: #ffffff; --fg: #1b2233; --muted: #5d6679; --line: #d9dee8;
  --ink: #2a3f8f; --ink-soft: #e4e9f8; --stamp: #c2402a; --stamp-soft: #fbe6e1; --wait: #a8730b;
  --code-bg: #eef1f7;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #11141b; --panel: #191d27; --fg: #e3e7f0; --muted: #9aa3b6; --line: #2c3343;
    --ink: #93a7ff; --ink-soft: #232b48; --stamp: #ff8a6b; --stamp-soft: #3a211c; --wait: #e0b44c;
    --code-bg: #1f2431; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body);
  font-size: 15px; line-height: 1.6;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px));
}
.wrap { max-width: 860px; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-size: 1.3rem; margin: 0; }
h1 small { font-size: 0.8rem; font-weight: 400; color: var(--muted); margin-left: 6px; }
h2 { font-size: 1rem; margin: 6px 0 0; }
code, .mono { font-family: var(--font-mono); font-size: 0.86em; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
a { color: var(--ink); }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* 진행 막대 (단계를 누르면 그 단계 처음으로) */
.progress { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.seg { display: grid; gap: 4px; font-size: 0.75rem; color: var(--muted); min-width: 0; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.seg .bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.seg .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width .4s ease; }
.seg.now { color: var(--fg); font-weight: 700; }
.seg .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 무대 */
.stage { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.chip { font-weight: 700; color: var(--ink); }
.scene { min-height: 250px; display: grid; align-content: start; gap: 10px; min-width: 0; }
.sub { margin: 0; padding: 12px 14px; border-radius: 10px; background: var(--fg); color: var(--panel); font-size: 1.05rem; font-weight: 700; line-height: 1.45; min-height: 3.2em; display: flex; align-items: center; }

/* 플레이어 조작 */
.player { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 14px; cursor: pointer; font-size: 0.88rem; }
.pbtn.main { background: var(--ink); border-color: var(--ink); color: var(--panel); font-weight: 700; min-width: 5.5em; }
.speed { display: flex; gap: 4px; margin-left: auto; align-items: center; font-size: 0.8rem; color: var(--muted); }
.speed button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 3px 9px; cursor: pointer; font-size: 0.8rem; }
.speed button[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); font-weight: 700; }
.count { font-family: var(--font-mono); font-size: 0.78rem; color: var(--muted); }

[data-at] { transition: opacity .5s ease, transform .5s ease; }
[data-at].off { opacity: 0; transform: translateY(8px); }

.flow { display: flex; flex-wrap: wrap; align-items: stretch; gap: 8px; }
.arrow { align-self: center; color: var(--muted); font-family: var(--font-mono); }
.box { border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--bg); min-width: 0; flex: 1 1 150px; transition: opacity .4s, background .4s, border-color .4s; }
.box .lbl { font-size: 0.7rem; letter-spacing: 0.06em; color: var(--muted); display: block; margin-bottom: 3px; }
.box.hl { border-color: var(--ink); background: var(--ink-soft); }
.box.warn { border-color: var(--stamp); background: var(--stamp-soft); }
.box.dead { opacity: 0.3; text-decoration: line-through; }
.ex { font-size: 0.7rem; color: var(--stamp); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 3px; white-space: nowrap; }
.pill { font-size: 0.78rem; border-radius: 999px; padding: 1px 9px; border: 1px solid var(--wait); color: var(--wait); }
.stamp { display: inline-block; border: 2px solid var(--stamp); color: var(--stamp); font-weight: 700; padding: 2px 12px; border-radius: 6px; transform: rotate(-6deg); letter-spacing: 0.1em; font-size: 1.1rem; }
.thump .stamp { animation: thump .5s ease-out; }
@keyframes thump { 0% { transform: rotate(-6deg) scale(2.2); opacity: 0; } 70% { transform: rotate(-6deg) scale(.92); opacity: 1; } 100% { transform: rotate(-6deg) scale(1); } }
.chain .box { flex: 1 1 120px; }
.chain.running .box { animation: light .4s ease both; }
@keyframes light { from { background: var(--bg); border-color: var(--line); } to { background: var(--ink-soft); border-color: var(--ink); } }
.chain.failed .box { animation: none; }
.ck { font-family: var(--font-mono); font-size: 0.8rem; display: grid; gap: 4px; }
.ck div { border-left: 3px solid var(--ink); background: var(--ink-soft); border-radius: 4px; padding: 3px 8px; overflow-wrap: anywhere; }
.ck .more { border: 0; background: none; color: var(--muted); padding-left: 11px; }
.badcut span { background: var(--stamp-soft); border: 1px dashed var(--stamp); border-radius: 4px; padding: 1px 4px; font-family: var(--font-mono); font-size: 0.82rem; }

@media (prefers-reduced-motion: reduce) {
  [data-at], .box, .seg .bar i { transition: none !important; }
  .thump .stamp, .chain.running .box { animation: none !important; }
}

/* 펼친 요약 */
.sum { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; align-content: start; min-width: 0; font-size: 0.86rem; }
.card h3 { margin: 0 0 2px; font-size: 0.95rem; }
.card h3 span { font-family: var(--font-mono); color: var(--ink); margin-right: 6px; }
.card p { margin: 0; }
.card .k { font-size: 0.72rem; color: var(--muted); margin-right: 4px; }
.card.todo { border-style: dashed; color: var(--muted); }
footer { font-size: 0.78rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>규정 문서 반영 복습<small>ONE Student</small></h1>

  <div class="progress" id="progress"></div>

  <section class="stage">
    <span class="chip" id="chip"></span>
    <div class="scene" id="scene"></div>
    <p class="sub" id="sub" aria-live="polite"></p>
    <div class="player">
      <button class="pbtn" id="prev" type="button" aria-label="이전 장면">◀ 이전</button>
      <button class="pbtn main" id="toggle" type="button">❚❚ 멈춤</button>
      <button class="pbtn" id="next" type="button" aria-label="다음 장면">다음 ▶</button>
      <span class="count" id="count"></span>
      <span class="speed">속도
        <button type="button" data-ms="8000">느리게</button>
        <button type="button" data-ms="5500">보통</button>
        <button type="button" data-ms="3500">빠르게</button>
      </span>
    </div>
  </section>

  <h2>한 장 요약</h2>
  <div class="sum" id="sum"></div>

  <footer>←/→ 장면 이동 · 스페이스 멈춤. 값은 저장소 파일로 잰 것이고 <span class="ex">예시</span>는 모양만 보여 주는 값. 출처: <a href="https://github.com/ChildrenAon/TIL/blob/main/2026/November/11-23.md">TIL 11-23</a> · <a href="https://github.com/ChildrenAon/TIL/blob/main/2026/November/11-24.md">11-24</a> · <a href="https://github.com/ONE-Student-WKU/web/blob/develop/server/scripts/seedRegulations.js">seedRegulations.js</a></footer>
</div>

<script>
// 단계마다 html 한 장 + 장면 목록. 장면 = { at: 이 번호 이하 data-at 요소를 보임, sub: 자막, fx: 덧붙일 효과 }
const steps = [
  {
    n: 1, name: '상황과 값',
    html: `
      <div class="flow">
        <div class="box" data-at="0"><span class="lbl">규정 문서</span><code>졸업/조기졸업.md</code></div>
        <span class="arrow" data-at="1">→</span>
        <div class="box" data-at="1"><span class="lbl">문서 · 1행</span>제목 '조기졸업', 분류 '졸업'</div>
        <span class="arrow" data-at="2">→</span>
        <div class="box hl" data-at="2"><span class="lbl">조각 · 6행</span>조각 글 + 숫자 배열 <span class="mono">[0.008, -0.029, …]</span><span class="ex">예시</span></div>
      </div>
      <div class="flow" data-at="3">
        <div class="box"><span class="lbl">질문</span>조기졸업 평점 기준이 뭐야?</div>
        <span class="arrow">→</span>
        <div class="box hl"><span class="lbl">뜻이 가장 가까운 조각</span>신청 성적기준</div>
        <span class="arrow">→</span>
        <div class="box"><span class="lbl">답변</span>그 조각을 근거로 AI가 답함</div>
      </div>
      <div class="box warn" data-at="4"><span class="lbl">이게 없으면</span>문서를 고쳐도 DB엔 옛 조각 → 챗봇이 옛 규정으로 답함</div>`,
    frames: [
      { at: 0, sub: '규정 문서 하나에서 시작한다' },
      { at: 1, sub: '문서 정보는 DB에 1행' },
      { at: 2, sub: '본문은 조각 6개로. 조각마다 뜻을 숫자 배열(임베딩)로 받아 같이 저장' },
      { at: 3, sub: '챗봇은 질문과 뜻이 가장 가까운 조각을 찾아 답한다 (RAG)' },
      { at: 4, sub: '그래서 문서를 고치면 다시 넣어야 한다. 하나만 고쳐도 전체를 다시 임베딩' },
    ],
  },
  {
    n: 2, name: '반영 시작',
    html: `
      <div class="flow">
        <div class="box" data-at="0"><span class="lbl">요청 (자동)</span>main push<br><code>db/regulations/**</code></div>
        <span class="arrow" data-at="1">→</span>
        <div class="box" data-at="1"><span class="lbl">GitHub Actions</span>실행 생성 <span class="pill">Waiting</span></div>
        <span class="arrow" data-at="2">→</span>
        <div class="box" data-at="2" id="stampbox" style="display:grid;place-items:center"><span class="lbl">승인자</span><span class="stamp">승인</span></div>
        <span class="arrow" data-at="3">→</span>
        <div class="box hl" data-at="3"><span class="lbl">시작</span>배포 → 재시딩 → 결과 확인</div>
      </div>
      <div class="flow">
        <div class="box warn" data-at="4"><span class="lbl">실행이 안 생김</span>develop 머지 · 코드만 바꾼 push</div>
        <div class="box warn" data-at="5"><span class="lbl">실제로 있었던 일</span><code>paths</code> 누락 → 조용히 안 돎 → PR마다 경고 추가</div>
      </div>`,
    frames: [
      { at: 0, sub: 'main에 push됐고, 바뀐 파일이 규정 경로에 걸린다' },
      { at: 1, sub: '실행이 생기지만 Waiting으로 멈춰 있다. push는 요청일 뿐' },
      { at: 2, sub: '승인자가 Approve 한 번. 이것만 승인이다', fx: () => $('stampbox').classList.add('thump') },
      { at: 3, sub: '그제야 배포 → 재시딩 → 결과 확인이 돈다' },
      { at: 4, sub: 'develop 머지나 코드만 바꾼 push는 실행이 아예 안 생긴다. 반영 시점은 main' },
      { at: 5, sub: '경로를 빠뜨리면 조용히 안 돌아서, PR마다 경로 누락을 경고한다' },
    ],
  },
  {
    n: 3, name: '실행',
    html: `
      <div class="flow">
        <div class="box" data-at="0"><span class="lbl">Actions</span><code>railway up</code></div>
        <span class="arrow" data-at="1">→</span>
        <div class="box" data-at="1"><span class="lbl">Railway</span>빌드</div>
        <span class="arrow" data-at="2">→</span>
        <div class="box" data-at="2"><span class="lbl">Railway</span>Start Command 실행</div>
      </div>
      <div class="flow chain" id="chain" data-at="3">
        <div class="box" style="animation-delay:0s"><span class="lbl">1단계</span>테이블 최신화</div>
        <span class="arrow">&amp;&amp;</span>
        <div class="box" id="acad" style="animation-delay:.5s"><span class="lbl">2~17단계</span>학사 데이터 → 표</div>
        <span class="arrow">&amp;&amp;</span>
        <div class="box" id="emb" style="animation-delay:1s"><span class="lbl">18단계</span><b>규정 임베딩</b></div>
        <span class="arrow">&amp;&amp;</span>
        <div class="box" id="art" style="animation-delay:1.5s"><span class="lbl">19단계</span>규정 조문 표</div>
      </div>
      <div class="box warn" data-at="5"><span class="lbl">버린 명령</span><code>redeploy</code> → 옛 빌드를 다시 돌림 → 승인한 커밋 반영 보장 ✗</div>`,
    frames: [
      { at: 0, sub: 'Actions는 승인된 커밋을 Railway에 올리기만 한다' },
      { at: 1, sub: 'Railway가 빌드한다. 빌드는 아직 작업이 아니다' },
      { at: 2, sub: '설정의 Start Command로 재시딩을 시작한다' },
      { at: 3, sub: '19단계를 && 로 차례로. 챗봇용 규정 임베딩은 18단계뿐', fx: () => $('chain').classList.add('running') },
      { at: 3, sub: '17단계(개설과목)가 실패하면 && 때문에 18 · 19단계도 안 돈다 → 챗봇은 옛 규정', fx: fail },
      { at: 5, sub: '처음 쓴 redeploy는 옛 빌드를 다시 돌려서, 커밋을 직접 올리는 up으로 바꿨다' },
    ],
  },
  {
    n: 4, name: '문서 쪼개기',
    html: `
      <div class="flow">
        <div class="box hl" data-at="0"><span class="lbl">정리 문서 (.md) · 소제목마다</span>
          <div class="ck"><div>### 1. 조기졸업 정의 …</div><div>### 2. 조기졸업 신청 성적기준 …</div><div class="more">… 이 문서는 6조각</div></div></div>
        <div class="box hl" data-at="1"><span class="lbl">학칙 원문 (.txt) · 조마다</span>
          <div class="ck"><div>제1조(목적) …</div><div>제2조(교육목표) …</div><div class="more">… 학칙은 127조각</div></div></div>
      </div>
      <div class="box warn" data-at="2"><span class="lbl">버린 방법: 글자 수로 자르기</span><div class="badcut"><span>…평균평점이</span> ✂ <span>4.3이상인 학생…</span></div></div>`,
    frames: [
      { at: 0, sub: '정리 문서는 ## · ### 소제목이 나올 때마다 자른다' },
      { at: 1, sub: '학칙 원문은 "제N조"가 나올 때마다 자른다' },
      { at: 2, sub: '글자 수로 자르면 조문이 중간에 끊긴다. 그래서 문서에 이미 있는 구조로 자른다' },
    ],
  },
];

const summary = [
  ['1', '상황과 값', '문서 → DB 1행 + 조각 N행(임베딩). 챗봇은 가까운 조각으로 답함', '하나만 고쳐도 전체를 다시 임베딩'],
  ['2', '반영 시작', 'main push + 규정 경로 → 실행 생김 → 승인 → 재시딩', 'paths 누락 → 조용히 안 돎 → PR 경고'],
  ['3', '실행', 'railway up → 빌드 → Start Command → 19단계 &&', '17 실패 → 18 규정 반영도 막힘 / redeploy 버림'],
  ['4', '문서 쪼개기', '정리 문서는 소제목, 원문은 제N조마다', '글자 수로 자르면 조문이 끊김 / Windows(CRLF) 로컬에선 제목 줄이 남음'],
];

const $ = (id) => document.getElementById(id);
function fail() {
  const c = $('chain'); c.classList.remove('running'); c.classList.add('failed');
  $('acad').classList.add('warn'); $('acad').innerHTML = '<span class="lbl">17단계</span>개설과목 실패 ✕';
  $('emb').classList.add('dead'); $('art').classList.add('dead');
}

$('sum').innerHTML = summary.map(([n, nm, a, b]) => `<div class="card"><h3><span>${n}</span>${nm}</h3><p>${a}</p><p><span class="k">주의</span>${b}</p></div>`).join('')
  + `<div class="card todo"><h3><span>5~7</span>임베딩 받기 · 바꿔 넣기 · 성공 판정</h3><p>공부 전. 공부하면 이어 붙인다.</p></div>`;

const timeline = [];
steps.forEach((s, si) => s.frames.forEach((f, fi) => timeline.push({ si, fi, ...f })));
timeline.push({ si: steps.length, fi: 0, end: true, sub: '5~7단계(임베딩 받기 · 바꿔 넣기 · 성공 판정)는 공부하면 이어 붙여요. 처음부터 다시 재생합니다' });

$('progress').innerHTML = steps.map((s, i) => `<button class="seg" type="button" data-si="${i}"><span class="bar"><i></i></span><span class="nm">${s.n} ${s.name}</span></button>`).join('')
  + `<button class="seg" type="button" data-si="${steps.length}"><span class="bar"><i></i></span><span class="nm">5~7 공부 전</span></button>`;

let idx = 0, playing = true, timer = null, ms = 5500;
try { const v = +localStorage.getItem('replay-ms'); if ([8000, 5500, 3500].includes(v)) ms = v; } catch (e) {}

// i번째 장면을 그린다. 같은 단계의 앞 장면 효과를 차례로 다시 적용해 되감기도 같은 모습이 된다.
let shownSi = -1, shownFi = -1;
function show(i) {
  idx = (i + timeline.length) % timeline.length;
  const f = timeline[idx], s = steps[f.si];
  const stepForward = f.si === shownSi && f.fi === shownFi + 1;
  if (!stepForward) {
    // 다른 단계로 가거나 되감으면 장면을 새로 그리고 앞 장면 효과를 다시 적용
    $('chip').textContent = s ? `${s.n}단계 · ${s.name}` : '5~7단계';
    $('scene').innerHTML = s ? s.html : '<div class="box">임베딩 받기 → 바꿔 넣기 → 성공 판정과 챗봇 반영</div>';
  }
  if (s) {
    document.querySelectorAll('#scene [data-at]').forEach((el) => el.classList.toggle('off', +el.dataset.at > f.at));
    (stepForward ? [f] : s.frames.slice(0, f.fi + 1)).forEach((fr) => fr.fx && fr.fx());
  }
  shownSi = f.si; shownFi = f.fi;
  $('sub').textContent = f.sub;
  $('count').textContent = `${idx + 1} / ${timeline.length}`;
  document.querySelectorAll('.seg').forEach((seg) => {
    const si = +seg.dataset.si, total = steps[si] ? steps[si].frames.length : 1;
    seg.classList.toggle('now', si === f.si);
    seg.querySelector('i').style.width = si < f.si ? '100%' : si === f.si ? ((f.fi + 1) / total * 100) + '%' : '0';
  });
  schedule();
}
function schedule() { clearTimeout(timer); timer = playing && !document.hidden ? setTimeout(() => show(idx + 1), ms) : null; }
function setPlaying(p) { playing = p; $('toggle').textContent = p ? '❚❚ 멈춤' : '▶ 재생'; schedule(); }

$('prev').onclick = () => show(idx - 1);
$('next').onclick = () => show(idx + 1);
$('toggle').onclick = () => setPlaying(!playing);
document.querySelectorAll('.seg').forEach((b) => b.onclick = () => show(timeline.findIndex((f) => f.si === +b.dataset.si)));
document.querySelectorAll('.speed button').forEach((b) => {
  b.setAttribute('aria-pressed', String(+b.dataset.ms === ms));
  b.onclick = () => {
    ms = +b.dataset.ms;
    document.querySelectorAll('.speed button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    try { localStorage.setItem('replay-ms', ms); } catch (e) {}
    schedule();
  };
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight') show(idx + 1);
  else if (e.key === 'ArrowLeft') show(idx - 1);
  else if (e.key === ' ' && !e.target.closest('button')) { e.preventDefault(); setPlaying(!playing); }
});
document.addEventListener('visibilitychange', schedule);

// 주소 끝 #step-N이면 그 단계부터 (TIL 날짜 기록에서 바로 오도록)
const m = /^#step-(\d)$/.exec(location.hash);
const start = m ? timeline.findIndex((f) => steps[f.si] && steps[f.si].n === +m[1]) : 0;
show(start >= 0 ? start : 0);
</script>
</body>
